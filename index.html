<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Discover Ocho Rios</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden;background:#f5f0e8;font-family:'Inter',system-ui,sans-serif}
    #map{position:absolute;inset:0;}

    #panel{
      position:fixed;bottom:0;left:0;right:0;height:44%;background:#fff;
      border-radius:28px 28px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,0.08);
      display:flex;flex-direction:column;overflow:hidden;
      padding-bottom:env(safe-area-inset-bottom,0);
    }
    #handle{display:flex;justify-content:center;padding:12px 0 8px;flex-shrink:0;}
    #handle-bar{width:36px;height:3.5px;border-radius:99px;background:#e2dbd0}
    #panel-title{font-size:15px;font-weight:600;color:#1a1208;padding:0 20px 12px;flex-shrink:0;}
    #card-row{
      display:flex;gap:12px;overflow-x:auto;padding:0 20px 20px;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1;align-items:flex-start;
    }
    #card-row::-webkit-scrollbar{display:none}

    .vcard{
      flex-shrink:0;width:260px;background:#faf6f0;border-radius:18px;
      overflow:hidden;display:flex;cursor:pointer;border:1px solid #ede8df;transition:transform .15s;
    }
    .vcard:active{transform:scale(0.98)}
    .vcard-swatch{width:82px;flex-shrink:0;display:flex;align-items:center;justify-content:center;min-height:90px;}
    .cat-dot{width:14px;height:14px;border-radius:50%;}
    .vcard-body{padding:12px 14px;display:flex;flex-direction:column;gap:3px;justify-content:center;min-width:0;}
    .vcard-cat{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
    .vcard-name{font-family:'Playfair Display',serif;font-size:15px;line-height:1.25;color:#1a1208;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .vcard-stars{font-size:12px;letter-spacing:1px;margin-top:1px}
    .vcard-more{font-size:11.5px;font-weight:500;color:#C45C10;margin-top:5px;}

    #detail{
      position:fixed;inset:0;z-index:50;background:rgba(30,20,10,0.45);
      display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .28s;
    }
    #detail.open{opacity:1;pointer-events:all}
    #detail-card{
      width:100%;background:#fff;border-radius:28px 28px 0 0;
      padding:14px 22px max(env(safe-area-inset-bottom),22px);
      transform:translateY(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);
    }
    #detail.open #detail-card{transform:translateY(0)}
    #detail-handle{display:flex;justify-content:center;padding-bottom:14px;position:relative}
    #detail-handle-bar{width:36px;height:3px;border-radius:99px;background:#e2dbd0}
    #detail-close{
      position:absolute;right:0;top:-4px;width:28px;height:28px;border-radius:50%;
      background:#f0ebe3;border:none;font-size:13px;color:#9a8870;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    #det-cat{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
    #det-name{font-family:'Playfair Display',serif;font-size:24px;line-height:1.2;color:#1a1208;margin-bottom:4px}
    #det-stars{font-size:15px;letter-spacing:2px;margin-bottom:8px;min-height:20px}
    #det-desc{font-size:13px;line-height:1.7;color:#9a8870;font-weight:300}
    #det-addr{font-size:12px;color:#b0a090;margin-top:6px;}

    .mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-top-right{display:none!important}
  </style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="handle"><div id="handle-bar"></div></div>
  <div id="panel-title">Explore Ocho Rios</div>
  <div id="card-row"></div>
</div>

<div id="detail" onclick="closeDet(event)">
  <div id="detail-card">
    <div id="detail-handle">
      <div id="detail-handle-bar"></div>
      <button id="detail-close" onclick="closeDet()">✕</button>
    </div>
    <div id="det-cat"></div>
    <div id="det-name"></div>
    <div id="det-stars"></div>
    <div id="det-desc"></div>
    <div id="det-addr"></div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoieXN1LWhybCIsImEiOiJjbWZtcjVkNXUwNTJkMmxvaDZpaTF6b2x2In0.8-4W7BoAy5GmwM2_-L_Jzw';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/ysu-hrl/cmfpr50qm00a401ry0uzb5b1q',
    center: [-77.1012, 18.4106],
    zoom: 15,
    pitch: 60,
    bearing: -10
  });

  async function loadJSON(url) { const r = await fetch(url); return r.json(); }

  function getRating(p) {
    const v = Number(p.rating ?? p.stars ?? 0);
    return v > 5 ? Math.round(v / 20) : Math.round(v);
  }
  function starsHTML(n) {
    if (!n) return '';
    const f = Math.min(5, Math.max(0, n));
    return `<span style="color:#B8860B">${'★'.repeat(f)}</span><span style="color:#ddd5c8">${'★'.repeat(5 - f)}</span>`;
  }

  function addCard(p, catLabel, catColor) {
    const rating = getRating(p);
    const card = document.createElement('div');
    card.className = 'vcard';
    card.innerHTML = `
      <div class="vcard-swatch" style="background:${catColor}20">
        <div class="cat-dot" style="background:${catColor}"></div>
      </div>
      <div class="vcard-body">
        <div class="vcard-cat" style="color:${catColor}">${catLabel}</div>
        <div class="vcard-name">${p.name || 'Unnamed'}</div>
        ${rating ? `<div class="vcard-stars">${starsHTML(rating)}</div>` : ''}
        <div class="vcard-more">See more</div>
      </div>`;
    card.addEventListener('click', () => openDet(p, catLabel, catColor));
    document.getElementById('card-row').appendChild(card);
  }

  function openDet(p, catLabel, catColor) {
    document.getElementById('det-cat').style.color = catColor;
    document.getElementById('det-cat').textContent  = catLabel;
    document.getElementById('det-name').textContent = p.name || 'Unnamed';
    document.getElementById('det-stars').innerHTML  = starsHTML(getRating(p));
    document.getElementById('det-desc').textContent = p.description || p.desc || '';
    document.getElementById('det-addr').textContent = p.address || '';
    document.getElementById('detail').classList.add('open');
  }

  window.closeDet = function(e) {
    if (!e || e.target === document.getElementById('detail'))
      document.getElementById('detail').classList.remove('open');
  };

  map.on('load', async () => {
    const [restaurants, hotels_budget, hotels_mid, hotels_luxury, services, tours] = await Promise.all([
      loadJSON('ochorios_restaurants.geojson'),
      loadJSON('ochorios_hotels_budget.geojson'),
      loadJSON('ochorios_hotels_mid.geojson'),
      loadJSON('ochorios_hotels_luxury.geojson'),
      loadJSON('ochorios_services.geojson'),
      loadJSON('ochorios_tours.geojson')
    ]).catch(() => []);

    if (restaurants) {
      map.addSource('restaurants', { type: 'geojson', data: restaurants });
      map.addLayer({ id: 'restaurants-buildings', type: 'fill-extrusion', source: 'restaurants', paint: { 'fill-extrusion-color': '#E8610A', 'fill-extrusion-height': 22, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.9 } });
      map.on('click', 'restaurants-buildings', e => openDet(e.features[0].properties, 'Dining', '#E8610A'));
      restaurants.features.forEach(f => addCard(f.properties, 'Dining', '#E8610A'));
    }

    if (hotels_budget) {
      map.addSource('hotels_budget', { type: 'geojson', data: hotels_budget });
      map.addLayer({ id: 'hotels-budget-buildings', type: 'fill-extrusion', source: 'hotels_budget', paint: { 'fill-extrusion-color': '#4CAF50', 'fill-extrusion-height': 25, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.9 } });
      map.on('click', 'hotels-budget-buildings', e => openDet(e.features[0].properties, 'Budget Hotel', '#4CAF50'));
      hotels_budget.features.forEach(f => addCard(f.properties, 'Budget Hotel', '#4CAF50'));
    }

    if (hotels_mid) {
      map.addSource('hotels_mid', { type: 'geojson', data: hotels_mid });
      map.addLayer({ id: 'hotels-mid-buildings', type: 'fill-extrusion', source: 'hotels_mid', paint: { 'fill-extrusion-color': '#FFB300', 'fill-extrusion-height': 30, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.9 } });
      map.on('click', 'hotels-mid-buildings', e => openDet(e.features[0].properties, 'Mid-Range Hotel', '#FFB300'));
      hotels_mid.features.forEach(f => addCard(f.properties, 'Mid-Range Hotel', '#FFB300'));
    }

    if (hotels_luxury) {
      map.addSource('hotels_luxury', { type: 'geojson', data: hotels_luxury });
      map.addLayer({ id: 'hotels-luxury-buildings', type: 'fill-extrusion', source: 'hotels_luxury', paint: { 'fill-extrusion-color': '#9C27B0', 'fill-extrusion-height': 40, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.9 } });
      map.on('click', 'hotels-luxury-buildings', e => openDet(e.features[0].properties, 'Luxury Hotel', '#9C27B0'));
      hotels_luxury.features.forEach(f => addCard(f.properties, 'Luxury Hotel', '#9C27B0'));
    }

    if (services) {
      map.addSource('services', { type: 'geojson', data: services });
      map.addLayer({ id: 'services-buildings', type: 'fill-extrusion', source: 'services', paint: { 'fill-extrusion-color': '#2196F3', 'fill-extrusion-height': 18, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.9 } });
      map.on('click', 'services-buildings', e => openDet(e.features[0].properties, 'Services', '#2196F3'));
      services.features.forEach(f => addCard(f.properties, 'Services', '#2196F3'));
    }

    if (tours) {
      map.addSource('tours', { type: 'geojson', data: tours });
      map.addLayer({ id: 'tours-buildings', type: 'fill-extrusion', source: 'tours', paint: { 'fill-extrusion-color': '#E91E8C', 'fill-extrusion-height': 22, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.9 } });
      map.on('click', 'tours-buildings', e => openDet(e.features[0].properties, 'Tours & Attractions', '#E91E8C'));
      tours.features.forEach(f => addCard(f.properties, 'Tours & Attractions', '#E91E8C'));
    }
  });
</script>
</body>
</html>
