<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Discover Ocho Rios</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden;background:#f5f0e8;font-family:'Inter',system-ui,sans-serif}
    #map{position:absolute;inset:0;}
    #panel{
      position:fixed;bottom:0;left:0;right:0;height:58%;background:#fff;
      border-radius:28px 28px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,0.08);
      display:flex;flex-direction:column;overflow:hidden;
      padding-bottom:env(safe-area-inset-bottom,0);
    }
    #handle{display:flex;justify-content:center;padding:12px 0 8px;flex-shrink:0;}
    #handle-bar{width:36px;height:3.5px;border-radius:99px;background:#e2dbd0}
    #panel-title{font-size:15px;font-weight:600;color:#1a1208;padding:0 20px 8px;flex-shrink:0;}
    #filter-row{
      display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;flex-shrink:0;
    }
    #filter-row::-webkit-scrollbar{display:none}
    .fchip{
      flex-shrink:0;padding:5px 13px;border-radius:99px;font-size:11.5px;font-weight:600;
      letter-spacing:.04em;cursor:pointer;border:1.5px solid transparent;transition:all .15s;
      white-space:nowrap;
    }
    .fchip.active{color:#fff;}
    .fchip:not(.active){background:#f5f0e8;color:#9a8870;border-color:#ede8df;}
    #card-row{
      display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:0 16px 20px;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1;
    }
    #card-row::-webkit-scrollbar{display:none}
    .vcard{
      width:100%;background:#faf6f0;border-radius:18px;
      overflow:hidden;display:flex;cursor:pointer;border:1px solid #ede8df;transition:transform .15s;
    }
    .vcard:active{transform:scale(0.98)}
    .vcard-swatch{width:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;min-height:80px;}
    .cat-dot{width:14px;height:14px;border-radius:50%;}
    .vcard-body{padding:12px 14px;display:flex;flex-direction:column;gap:3px;justify-content:center;min-width:0;}
    .vcard-cat{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
    .vcard-name{font-family:'Playfair Display',serif;font-size:15px;line-height:1.25;color:#1a1208;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .vcard-stars{font-size:12px;letter-spacing:1px;margin-top:1px}
    .vcard-more{font-size:11.5px;font-weight:500;color:#C45C10;margin-top:5px;}
    #detail{
      position:fixed;inset:0;z-index:50;background:rgba(30,20,10,0.45);
      display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .28s;
    }
    #detail.open{opacity:1;pointer-events:all}
    #detail-card{
      width:100%;background:#fff;border-radius:28px 28px 0 0;
      padding:14px 22px max(env(safe-area-inset-bottom),22px);
      transform:translateY(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);
    }
    #detail.open #detail-card{transform:translateY(0)}
    #detail-handle{display:flex;justify-content:center;padding-bottom:14px;position:relative}
    #detail-handle-bar{width:36px;height:3px;border-radius:99px;background:#e2dbd0}
    #detail-close{
      position:absolute;right:0;top:-4px;width:28px;height:28px;border-radius:50%;
      background:#f0ebe3;border:none;font-size:13px;color:#9a8870;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    #det-cat{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
    #det-name{font-family:'Playfair Display',serif;font-size:24px;line-height:1.2;color:#1a1208;margin-bottom:4px}
    #det-stars{font-size:15px;letter-spacing:2px;margin-bottom:8px;min-height:20px}
    #det-desc{font-size:13px;line-height:1.7;color:#9a8870;font-weight:300}
    #det-addr{font-size:12px;color:#b0a090;margin-top:6px;}
    #det-img{width:100%;border-radius:14px;object-fit:cover;max-height:160px;display:none;margin-bottom:10px;}
    .mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-top-right{display:none!important}
  </style>
</head>

    <div id="det-cat"></div>
    <div id="det-name"></div>
    <div id="det-stars"></div>
    <div id="det-desc"></div>
    <div id="det-addr"></div>
  </div>

    { label: 'Dining',       color: '#E8610A' },

    { label: 'Budget Hotel', color: '#4CAF50' },

    { label: 'Services',     color: '#2196F3' },
  ];
  let activeFilter = 'All';

  const filterRow = document.getElementById('filter-row');
  FILTERS.forEach(f => {
    const chip = document.createElement('div');
    chip.className = 'fchip' + (f.label === 'All' ? ' active' : '');
    chip.textContent = f.label;
    chip.dataset.label = f.label;
    if (f.label === 'All') { chip.style.background = '#1a1208'; }
    else if (f.label === activeFilter) { chip.style.background = f.color; }
    chip.addEventListener('click', () => {
      activeFilter = f.label;
      document.querySelectorAll('.fchip').forEach(c => {
        const cl = c.dataset.label;
        const fc = FILTERS.find(x => x.label === cl);
        if (cl === activeFilter) {
          c.classList.add('active');
          c.style.background = fc.color;
          c.style.borderColor = fc.color;
        } else {
          c.classList.remove('active');
          c.style.background = '';
          c.style.borderColor = '';
        }
      });
      document.querySelectorAll('.vcard').forEach(card => {
        card.style.display = (activeFilter === 'All' || card.dataset.cat === activeFilter) ? 'flex' : 'none';
      });
    });
    filterRow.appendChild(chip);
  });
    if (!n) return '';
    const f = Math.min(5, Math.max(0, n));
    return `<span style="color:#B8860B">${'★'.repeat(f)}</span><span style="color:#ddd5c8">${'★'.repeat(5 - f)}</span>`;
  }

  function addCard(name, desc, addr, catLabel, catColor, stars) {
    const card = document.createElement('div');
    card.className = 'vcard';
    card.dataset.cat = catLabel;
    card.innerHTML = `
      <div class="vcard-swatch" style="background:${catColor}20">
        <div class="cat-dot" style="background:${catColor}"></div>
      </div>
      <div class="vcard-body">
        <div class="vcard-cat" style="color:${catColor}">${catLabel}</div>
        <div class="vcard-name">${name}</div>
        <div class="vcard-stars">${starsHTML(stars)}</div>
        <div class="vcard-more">See more</div>
      </div>`;
    card.addEventListener('click', () => openDet(name, desc, addr, catLabel, catColor, stars));
    document.getElementById('card-row').appendChild(card);
  }

  function openDet(name, desc, addr, catLabel, catColor, stars, img) {
    const detImg = document.getElementById('det-img');
    if (img) { detImg.src = img; detImg.style.display = 'block'; }
    else { detImg.src = ''; detImg.style.display = 'none'; }
    document.getElementById('det-cat').style.color = catColor;
    document.getElementById('det-cat').textContent  = catLabel;
    document.getElementById('det-name').textContent = name;
    document.getElementById('det-stars').innerHTML  = starsHTML(stars);
    document.getElementById('det-desc').textContent = desc;
    document.getElementById('det-addr').textContent = addr ? '📍 ' + addr : '';
    document.getElementById('detail').classList.add('open');
  }
